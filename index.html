    let currentBaseFilter = 'Todos';
    let activeTags = new Set();

    let userDocRef;
    let userData = { favoritos: [], assistidos: [], quero: [], estrelas: {}, comentarios: [], bandeira: "", isPublic: false };

    let chatMessages = [];
    let lastReadChatTime = parseInt(localStorage.getItem('saficos_last_read_chat')) || 0;
    let unsubscribeChat = null;

    function syncFilmesWithUserData() {
        filmes = filmes.map(filme => ({
            ...filme,
            favorito: userData.favoritos.includes(filme.titulo),
            assistido: userData.assistidos.includes(filme.titulo),
            queroAssistir: userData.quero.includes(filme.titulo),
            userRating: userData.estrelas[filme.titulo] || 0
        }));
    }

    function shuffleArray(array) {
      const shuffled = [...array];
      for (let i = shuffled.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
      }
      return shuffled;
    }

    function render() {
      if (currentView === 'grid') {
        dom.destaque.style.display = 'none';
        applyAllFilters();
      } else if (currentView === 'amigos') {
         mostrarAmigos();
      } else if (currentView === 'ajuda') {
         mostrarAjuda();
      } else if (currentView === 'home') {
        mostrarTelaInicial();
      }
    }

    function renderDestaque() {
        const filmesParaDestaque = filmes.filter(f => f.galleryImages && f.galleryImages.length > 0 && !f.assistido);
        if (filmesParaDestaque.length === 0) {
            dom.destaque.style.display = 'none';
            return;
        }

        const filmeDestaque = filmesParaDestaque[Math.floor(Math.random() * filmesParaDestaque.length)];
        const imagemDestaque = filmeDestaque.galleryImages[Math.floor(Math.random() * filmeDestaque.galleryImages.length)];
        dom.destaque.style.backgroundImage = `url('${imagemDestaque}')`;
        dom.destaque.innerHTML = `
            <div class="destaque-info">
                <h2>${filmeDestaque.titulo}</h2>
                <p>${filmeDestaque.sinopse}</p>
                <a href="#" id="destaque-ver-mais">Ver Mais</a>
            </div>
        `;
        dom.destaque.style.display = 'flex';
        document.getElementById('destaque-ver-mais').onclick = (e) => {
            e.preventDefault();
            const index = filmes.findIndex(f => f.titulo === filmeDestaque.titulo);
            abrirModal(index);
        };
    }
    
    function mostrarTelaInicial() {
      currentView = 'home';
      dom.displayArea.innerHTML = "";
      dom.displayArea.className = '';
      resetFilters();
      renderDestaque();

      const createSection = (title, data) => {
        if (data.length) {
          const secao = document.createElement("section");
          const h2 = document.createElement("h2");
          h2.className = 'section-title';
          h2.textContent = title;
          secao.appendChild(h2);
          const linha = document.createElement("div");
          linha.className = "linha-horizontal";
          data.forEach(filme => linha.appendChild(createCard(filme, 'mini')));
          secao.appendChild(linha);
          dom.displayArea.appendChild(secao);
        }
      };

      const naoAssistidos = shuffleArray(filmes.filter(f => !f.assistido)).slice(0, 10);
      createSection("Descubra", naoAssistidos);
      createSection("Queridinhos", filmes.filter(f => f.favorito));
      
      const tagsExcluidas = ['Series', 'Filmes', 'Adult'];
      const todasAsTags = Array.from(new Set(filmes.flatMap(f => f.tags)))
                                .filter(tag => !tagsExcluidas.includes(tag));
      
      const tagsAleatorias = shuffleArray(todasAsTags).slice(0, 4);

      tagsAleatorias.forEach(tag => {
          const filmesDaTag = shuffleArray(filmes.filter(f => f.tags.includes(tag))).slice(0, 10);
          createSection(tag, filmesDaTag);
      });
    }

    function mostrarFilmesGrid(lista) {
      currentView = 'grid';
      dom.destaque.style.display = 'none';
      dom.displayArea.innerHTML = ""; 
      dom.displayArea.className = 'grid-container'; 

      const grid = document.createElement('div');
      grid.className = 'grid';

      if(lista.length === 0) {
        grid.innerHTML = `<p>Nenhum item encontrado para os filtros selecionados.</p>`;
      } else {
        lista.forEach(filme => grid.appendChild(createCard(filme, 'grid')));
      }
      dom.displayArea.appendChild(grid); 
    }

    function mostrarAjuda() {
        currentView = 'ajuda';
        dom.destaque.style.display = 'none';
        dom.displayArea.innerHTML = '';
        dom.displayArea.className = 'ajuda-wrapper';
        ocultarContador();

        const ajudaHTML = `
            <div class="ajuda-container">
                <h2 class="section-title dynamic-title">Ajuda & Tutoriais</h2>
                
                <div class="ajuda-card">
                    <h3>👤 Perfil e Amigos</h3>
                    <ul>
                        <li><strong>Como ser visto na aba Amigos:</strong> Para interagir e ter o seu perfil listado, abra o menu lateral (☰), vá até o final e ative <strong>Perfil Público 👁️</strong>.</li>
                        <li><strong>Como mudar a foto de perfil:</strong> Abra o menu lateral e clique no ícone de lápis (✎) sobre a sua foto.</li>
                        <li><strong>Como colar o URL da foto:</strong> Ao clicar no lápis, vá no Google ou Pinterest, clique com o botão direito na foto escolhida e clique em <em>"Copiar endereço da imagem"</em>. Cole esse texto no site.</li>
                        <li><strong>Como escolher sua bandeira:</strong> Clique no pequeno círculo colado na sua foto de perfil para expandir e escolher a bandeira que te representa. Isso vai adicionar uma borda bonita na sua foto!</li>

                        <li><strong>Como pesquisar:</strong> Clique na lupa no topo direito para buscar por título, ator ou sinopse.</li>
                        <li><strong>Como usar as Tags:</strong> Use o menu central lá em cima para filtrar "Séries" ou "Filmes". Clique na setinha para baixo (▼) para escolher gêneros.</li>

                        <li><strong>Como dar Nota:</strong> Nos detalhes do filme, clique nas estrelinhas abaixo dos botões (1 a 5 estrelas). Ao avaliar um filme, ele é automaticamente marcado como "Assistido"!</li>
                        <li><strong>Como Comentar:</strong> Role os detalhes do filme até a aba "Comentários". Escreva sua opinião e clique em Publicar. Você pode excluir seu próprio comentário clicando na lixeira (🗑️).</li>
                        <li><strong>Chat Global:</strong> Clique no botão flutuante redondo (💬) no canto inferior direito da tela para conversar com todo mundo. Uma bolinha com o número de mensagens não lidas te avisa se tiver novidades!</li>

    async function mostrarAmigos() {
        currentView = 'amigos';
        dom.destaque.style.display = 'none';
        dom.displayArea.className = '';
        ocultarContador();

        try {
            const querySnapshot = await getDocs(collection(db, "usuarios"));
            const usuariosPublicos = [];
            querySnapshot.forEach((doc) => {
                const data = doc.data();
                data.uid = doc.id; 
                if (data.isPublic) {
                    usuariosPublicos.push(data);
                }
            });

            if (usuariosPublicos.length === 0) {
                dom.displayArea.innerHTML = '<h2 class="section-title dynamic-title">Amigos</h2><p>Nenhum usuário com perfil público encontrado.</p>';
                return;
            }
            
            // Lógica do Pódio
            const sortedByWatched = [...usuariosPublicos].sort((a,b) => (b.assistidos?.length || 0) - (a.assistidos?.length || 0));
            const top3 = sortedByWatched.slice(0, 3);
            
            let podiumHTML = '';
            if (top3.length > 0) {
                const getPodiumUser = (user, rank) => {
                    if(!user) return `<div class="podium-step-container step-${rank} empty"></div>`;
                    const count = (user.assistidos || []).length;
                    const medal = rank === 1 ? '🥇' : rank === 2 ? '🥈' : '🥉';
                    const pic = user.foto || 'https://cdn.pixabay.com/photo/2015/10/05/22/37/blank-profile-picture-973460_960_720.png';
                    const flag = user.bandeira ? `<img src="${user.bandeira}" class="podium-flag">` : '';
                    const borderClass = user.bandeira ? 'has-border' : '';
                    return `
                        <div class="podium-step-container step-${rank}">
                            <div class="podium-avatar-wrapper">
                                <span class="podium-medal">${medal}</span>
                                <img src="${pic}" class="podium-pic ${borderClass}">
                                ${flag}
                            </div>
                            <span class="podium-name">${user.apelido}</span>
                            <div class="podium-bar">
                                <span class="podium-score">${count} assistidos</span>
                            </div>
                        </div>
                    `;
                };

                podiumHTML = `
                    <div class="podium-wrapper">
                        ${getPodiumUser(top3[1], 2)}
                        ${getPodiumUser(top3[0], 1)}
                        ${getPodiumUser(top3[2], 3)}
                    </div>
                `;
            }

            dom.displayArea.innerHTML = `
                <div class="amigos-header">
                    <h2 class="section-title dynamic-title" style="margin:0;"></h2>
                </div>
                ${podiumHTML}
                <hr class="amigos-divider">
                <h2 class="section-title dynamic-title" style="margin-top:20px;">Todos os Amigos</h2>
            `;

            const amigosContainer = document.createElement('div');
            amigosContainer.id = 'amigos-section';

            usuariosPublicos.forEach(amigoData => {
                const amigoCard = document.createElement('div');
                amigoCard.className = 'amigo-card';
                amigoCard.dataset.uid = amigoData.uid;

                const mapTitlesToFilmes = (titles) => (titles || []).map(titulo => filmes.find(f => f.titulo === titulo)).filter(Boolean);
                const filmesFavoritos = mapTitlesToFilmes(amigoData.favoritos);
                const filmesAssistidos = mapTitlesToFilmes(amigoData.assistidos);
                const filmesQuero = mapTitlesToFilmes(amigoData.quero);
                const comentarios = amigoData.comentarios || [];

                const bandeiraHTML = amigoData.bandeira ? `<img src="${amigoData.bandeira}" class="amigo-flag-badge">` : '';
                const borderClass = amigoData.bandeira ? 'has-border' : '';

                amigoCard.innerHTML = `
                    <div class="amigo-profile-info">
                        <div class="amigo-pic-wrapper">
                            <img src="${amigoData.foto}" alt="Foto de ${amigoData.apelido}" class="amigo-profile-pic ${borderClass}">
                            ${bandeiraHTML}
                        </div>
                        <div>
                            <h3 class="amigo-name">${amigoData.apelido}</h3>
                            <p class="amigo-watched-count">${(amigoData.assistidos || []).length} assistidos</p>
                        </div>
                    </div>
                     <div class="amigo-list-selector">
                        <button class="amigo-tab-btn active" data-list="favoritos">Favoritos</button>
                        <button class="amigo-tab-btn" data-list="assistidos">Assistidos</button>
                        <button class="amigo-tab-btn" data-list="quero">Quero Assistir</button>
                        <button class="amigo-tab-btn" data-list="comentarios">Comentários</button>
                    </div>`;

                const createListContainer = (listName, filmList) => {
                    const container = document.createElement('div');
                    container.className = 'amigo-film-list-container';
                    container.dataset.list = listName;
                    const linha = document.createElement('div');
                    linha.className = 'linha-horizontal';
                    if (filmList.length > 0) {
                        filmList.forEach(filme => linha.appendChild(createCard(filme, 'mini')));
                    } else {
                        linha.innerHTML = `<p class="no-items-message">Nenhum item para mostrar.</p>`;
                    }
                    container.appendChild(linha);
                    return container;
                };

                const favContainer = createListContainer('favoritos', filmesFavoritos);
                const watchedContainer = createListContainer('assistidos', filmesAssistidos);
                const wantContainer = createListContainer('quero', filmesQuero);
                
                const commentsContainer = document.createElement('div');
                commentsContainer.className = 'amigo-film-list-container amigo-comments-container';
                commentsContainer.dataset.list = 'comentarios';
                
                if (comentarios.length > 0) {
                    const sortedComments = [...comentarios].sort((a,b) => b.timestamp - a.timestamp);
                    sortedComments.forEach(c => {
                         const rating = (amigoData.estrelas && amigoData.estrelas[c.filme]) ? amigoData.estrelas[c.filme] : 0;
                         const isOwner = amigoData.uid === auth.currentUser.uid;
                         const deleteBtnHtml = isOwner ? `<button class="delete-comment-btn" title="Excluir">🗑️</button>` : '';

                         const div = document.createElement('div');
                         div.className = 'amigo-recent-comment';
                         div.innerHTML = `
                             <div class="comment-header">
                                <strong style="color: var(--cor-principal); font-size: 16px;">${c.filme}</strong>
                                <span class="comment-stars">${createStarsHTML(rating)}</span>
                                ${deleteBtnHtml}
                             </div>
                             <p>"${c.texto}"</p>
                             <span class="comment-date">${new Date(c.timestamp).toLocaleDateString('pt-BR')}</span>
                         `;
                         
                         if (isOwner) {
                             div.querySelector('.delete-comment-btn').onclick = () => deletarComentario(c.timestamp, c.filme);
                         }

                         commentsContainer.appendChild(div);
                    });
                } else {
                    commentsContainer.innerHTML = `<p class="no-items-message">Nenhum comentário ainda.</p>`;
                }

                watchedContainer.style.display = 'none';
                wantContainer.style.display = 'none';
                commentsContainer.style.display = 'none';

                amigoCard.appendChild(favContainer);
                amigoCard.appendChild(watchedContainer);
                amigoCard.appendChild(wantContainer);
                amigoCard.appendChild(commentsContainer);
                amigosContainer.appendChild(amigoCard);
            });
            dom.displayArea.appendChild(amigosContainer);

            document.querySelectorAll('.amigo-tab-btn').forEach(button => {
                button.addEventListener('click', (e) => {
                    const targetButton = e.target;
                    const listToShow = targetButton.dataset.list;
                    const card = targetButton.closest('.amigo-card');
                    card.querySelectorAll('.amigo-tab-btn').forEach(btn => btn.classList.remove('active'));
                    targetButton.classList.add('active');
                    card.querySelectorAll('.amigo-film-list-container').forEach(c => c.style.display = 'none');
                    card.querySelector(`.amigo-film-list-container[data-list="${listToShow}"]`).style.display = 'flex';
                });
            });

        } catch (error) {
            console.error("Erro ao buscar usuários:", error);
            dom.displayArea.innerHTML += '<p>Ocorreu um erro ao carregar a lista de amigos.</p>';
        }
    }

    // --- FUNÇÕES DO CHAT GLOBAL ---
    function initChatListener() {
        if (unsubscribeChat) unsubscribeChat();
        const q = query(collection(db, "mensagens"), orderBy("timestamp", "asc"));
        
        unsubscribeChat = onSnapshot(q, (snapshot) => {
            chatMessages = [];
            snapshot.forEach((doc) => {
                chatMessages.push({ id: doc.id, ...doc.data() });
            });
            renderChatMessages();
            updateChatBadge();
        });
    }

    function updateChatBadge() {
        if (dom.chat.sidebar.classList.contains('open')) {
            lastReadChatTime = Date.now();
            localStorage.setItem('saficos_last_read_chat', lastReadChatTime);
            dom.chat.badge.style.display = 'none';
            return;
        }
        
        const unreadCount = chatMessages.filter(m => m.timestamp > lastReadChatTime).length;
        if (unreadCount > 0) {
            dom.chat.badge.textContent = unreadCount > 99 ? '99+' : unreadCount;
            dom.chat.badge.style.display = 'flex';
        } else {
            dom.chat.badge.style.display = 'none';
        }
    }

    function abrirChat() {
        fecharModal(); 
        dom.chat.sidebar.classList.add('open');
        lastReadChatTime = Date.now();
        localStorage.setItem('saficos_last_read_chat', lastReadChatTime);
        updateChatBadge();
        renderChatMessages();
        
        setTimeout(() => {
            dom.chat.messagesContainer.scrollTop = dom.chat.messagesContainer.scrollHeight;
        }, 100);
        
        dom.chat.input.focus();
    }

    function fecharChat() {
        dom.chat.sidebar.classList.remove('open');
        lastReadChatTime = Date.now();
        localStorage.setItem('saficos_last_read_chat', lastReadChatTime);
        updateChatBadge();
    }

    async function enviarMensagemChat() {
        const texto = dom.chat.input.value.trim();
        if (!texto) return;
        
        dom.chat.input.value = ''; 
        try {
            await addDoc(collection(db, "mensagens"), {
                uid: auth.currentUser.uid,
                nome: userData.apelido || "Anônimo",
                foto: userData.foto || "https://cdn.pixabay.com/photo/2015/10/05/22/37/blank-profile-picture-973460_960_720.png",
                bandeira: userData.bandeira || "",
                texto: texto,
                timestamp: Date.now()
            });
        } catch(e) {
            console.error("Erro ao enviar mensagem no chat:", e);
        }
    }

    function renderChatMessages() {
        dom.chat.messagesContainer.innerHTML = '';
        chatMessages.forEach(m => {
            const isOwn = m.uid === auth.currentUser?.uid;
            const date = new Date(m.timestamp);
            const dia = date.getDate().toString().padStart(2, '0');
            const mes = (date.getMonth() + 1).toString().padStart(2, '0');
            const horas = date.getHours().toString().padStart(2, '0');
            const minutos = date.getMinutes().toString().padStart(2, '0');
            
            // Montando o texto final (ex: "16/04 às 15:30")
            const timeStr = `${dia}/${mes} às ${horas}:${minutos}`;
            const flagHtml = m.bandeira ? `<img src="${m.bandeira}" class="chat-flag">` : '';
            const borderClass = m.bandeira ? 'has-border' : '';
            const bubbleClass = isOwn ? 'chat-msg own' : 'chat-msg';

const html = `
                <div class="${bubbleClass}">
                    <div class="chat-user-profile">
                        <div class="chat-pic-wrapper">
                            <img src="${m.foto}" class="chat-pic ${borderClass}">
                            ${flagHtml}
                        </div>
                        <div class="chat-name">${m.nome}</div>
                    </div>
                    
                    <div class="chat-bubble-container">
                        <div class="chat-bubble">${m.texto}</div>
                        <div class="chat-time">${timeStr}</div>
                    </div>
                </div>
            `;
            dom.chat.messagesContainer.insertAdjacentHTML('beforeend', html);
        });
        
        if (dom.chat.sidebar.classList.contains('open')) {
            dom.chat.messagesContainer.scrollTop = dom.chat.messagesContainer.scrollHeight;
        }
    }

    function createDurationDotsHTML(screentime) {
      if (!screentime) return '';
      let dotCount = 0;
      const lowerScreentime = screentime.toLowerCase();

      if (lowerScreentime === 'long' || lowerScreentime === 'high') dotCount = 3;
      else if (lowerScreentime === 'medium') dotCount = 2;
      else if (lowerScreentime === 'short') dotCount = 1;
      return dotCount > 0 ? '<div class="duration-dot"></div>'.repeat(dotCount) : '';
    }

    function createStarsHTML(rating) {
        if (!rating || rating === 0) return '';
        let starsHTML = '';
        for (let i = 1; i <= 5; i++) {
            starsHTML += `<span class="star ${i <= rating ? 'filled' : ''}">★</span>`;
        }
        return starsHTML;
    }
    
    function createCard(filme, type) {
        const card = document.createElement("div");
        card.className = `card-base ${type === 'grid' ? 'card' : 'card-mini'}`;
        
        const starsHTML = currentBaseFilter === 'Assistidos' ? createStarsHTML(filme.userRating) : '';

        card.innerHTML = `
            <div class="card-image-wrapper">
                <img src="${filme.imagem}" alt="${filme.titulo}" />
                <div class="duration-dots-container">${createDurationDotsHTML(filme.screentime)}</div>
            </div>
            <div class="card-content">
              <h3>${filme.titulo}</h3>
              ${type === 'grid' ? `
                  <div class="synopsis">${filme.sinopse}</div>
                  <div class="card-stars-display">${starsHTML}</div>
                  `
              : ''}
            </div>
        `;
        const favButton = document.createElement('button');
        favButton.className = `favorite-heart ${filme.favorito ? 'favorited' : ''}`;
        favButton.innerHTML = '❤';
        favButton.title = "Favoritar";
        favButton.onclick = (e) => {
            e.stopPropagation();
            toggleFavorite(filme.titulo);
        };
        card.prepend(favButton);
        card.onclick = () => {
             const index = filmes.findIndex(f => f.titulo === filme.titulo);
             abrirModal(index);
        };
        return card;
    }

    function popularTags() {
        dom.tags.fixedContainer.innerHTML = '';
        ['Todos', 'Series', 'Filmes'].forEach(tagText => {
            const el = document.createElement("span");
            el.className = "tag base-tag";
            el.textContent = tagText;
            el.onclick = () => handleBaseFilterClick(tagText);
            dom.tags.fixedContainer.appendChild(el);
        });
        const allOtherTags = new Set(filmes.flatMap(f => f.tags));
        ['Series', 'Filmes', 'Adult'].forEach(t => allOtherTags.delete(t));
        dom.tags.dropdownContent.innerHTML = '';
        allOtherTags.forEach(tagText => {
            const el = document.createElement("a");
            el.href = "#";
            el.className = "dropdown-tag";
            el.textContent = tagText;
            el.onclick = (e) => {
                e.preventDefault();
                e.stopPropagation();
                toggleTagFilter(tagText);
            };
            dom.tags.dropdownContent.appendChild(el);
        });
        updateTagUI();
    }

    function handleBaseFilterClick(tagText) {
        currentBaseFilter = tagText;
        currentView = 'grid';
        applyAllFilters();
    }

    function toggleTagFilter(tagText) {
        if (activeTags.has(tagText)) {
            activeTags.delete(tagText);
        } else {
            activeTags.add(tagText);
        }
        currentView = 'grid';
        applyAllFilters();
    }

    function updateTagUI() {
        dom.tags.fixedContainer.querySelectorAll('.base-tag').forEach(el => {
            el.classList.toggle('active', el.textContent === currentBaseFilter);
        });
        dom.tags.selectedContainer.innerHTML = '';
        activeTags.forEach(tagText => {
            const el = document.createElement("span");
            el.className = "tag active";
            el.textContent = tagText;
            el.onclick = () => toggleTagFilter(tagText);
            dom.tags.selectedContainer.appendChild(el);
        });
        dom.tags.separator.style.display = activeTags.size > 0 ? 'block' : 'none';

        dom.tags.dropdownContent.querySelectorAll('.dropdown-tag').forEach(el => {
            el.classList.toggle('active', activeTags.has(el.textContent));
        });
    }

    function applyAllFilters() {
      let filteredList = [...filmes];
      syncFilmesWithUserData();

      if (currentBaseFilter === 'Series') {
          filteredList = filteredList.filter(f => f.tags.includes('Series'));
      } else if (currentBaseFilter === 'Filmes') {
          filteredList = filteredList.filter(f => !f.tags.includes('Series'));
      } else if (currentBaseFilter === 'Favoritos') {
          filteredList = filteredList.filter(f => f.favorito);
      } else if (currentBaseFilter === 'Assistidos') {
          filteredList = filteredList.filter(f => f.assistido);
      } else if (currentBaseFilter === 'Quero Assistir') {
          filteredList = filteredList.filter(f => f.queroAssistir);
      }

      if (activeTags.size > 0) {
          filteredList = filteredList.filter(f => {
              return Array.from(activeTags).every(tag => f.tags.includes(tag));
          });
      }

      const searchTerm = dom.search.box.value.toLowerCase().trim();
      if (searchTerm) {
          filteredList = filteredList.filter(f => {
            const titulo = (f.titulo || '').toLowerCase();
            const sinopse = (f.sinopse || '').toLowerCase();
            const elenco = (Array.isArray(f.elenco) ? f.elenco.join(', ') : (f.elenco || '')).toLowerCase();

            return titulo.includes(searchTerm) ||
                   elenco.includes(searchTerm) ||
                   sinopse.includes(searchTerm);
          });
      }

      mostrarFilmesGrid(filteredList);
      updateTagUI();
    }

    function resetFilters() {
        currentBaseFilter = 'Todos';
        activeTags.clear();
        updateTagUI();
    }

    async function toggleFavorite(titulo) {
      const idx = userData.favoritos.indexOf(titulo);
      if (idx >= 0) userData.favoritos.splice(idx, 1);
      else userData.favoritos.push(titulo);
      await updateDoc(userDocRef, { favoritos: userData.favoritos });
      syncFilmesWithUserData();
      const index = filmes.findIndex(f => f.titulo === titulo);
      if (dom.modal.bg.classList.contains("open")) updateModalButtons(index);
      render();
    }
    
    async function toggleAssistido(titulo) {
      const idx = userData.assistidos.indexOf(titulo);
      if (idx >= 0) userData.assistidos.splice(idx, 1);
      else userData.assistidos.push(titulo);
      await updateDoc(userDocRef, { assistidos: userData.assistidos });
      syncFilmesWithUserData();
      updateWatchedCounters(); 
      const index = filmes.findIndex(f => f.titulo === titulo);
      if (dom.modal.bg.classList.contains("open")) updateModalButtons(index);
      render();
    }

    async function toggleQueroAssistir(titulo) {
      const idx = userData.quero.indexOf(titulo);
      if (idx >= 0) userData.quero.splice(idx, 1);
      else userData.quero.push(titulo);
      await updateDoc(userDocRef, { quero: userData.quero });
      syncFilmesWithUserData();
      const index = filmes.findIndex(f => f.titulo === titulo);
      if (dom.modal.bg.classList.contains("open")) updateModalButtons(index);
      render();
    }

    async function setUserRating(titulo, rating) {
      const currentRating = userData.estrelas[titulo] || 0;
      userData.estrelas[titulo] = currentRating === rating ? 0 : rating;
      
      let marcouComoAssistido = false;
      let assistidosAtualizados = userData.assistidos;

      // NOVO: Adiciona automaticamente aos assistidos se der uma nota e ainda não estiver
      if (rating > 0 && !userData.assistidos.includes(titulo)) {
          assistidosAtualizados.push(titulo);
          marcouComoAssistido = true;
      }

      await updateDoc(userDocRef, { 
          estrelas: userData.estrelas,
          assistidos: assistidosAtualizados
      });

      syncFilmesWithUserData();
      const index = filmes.findIndex(f => f.titulo === titulo);
      if (dom.modal.bg.classList.contains("open")) {
          renderStarsInModal(index);
          if(marcouComoAssistido) updateModalButtons(index);
          renderCommentsForMovie(titulo); 
      }
      if(marcouComoAssistido) updateWatchedCounters();
      render();
    }

    async function adicionarComentario(titulo) {
        const texto = dom.modal.commentInput.value.trim();
        if(!texto) return;

        if (!userData.comentarios) userData.comentarios = [];
        
        const novoComentario = {
            filme: titulo,
            texto: texto,
            timestamp: Date.now()
        };
        
        userData.comentarios.push(novoComentario);
        
        try {
            await updateDoc(userDocRef, { comentarios: userData.comentarios });
            dom.modal.commentInput.value = ''; 
            renderCommentsForMovie(titulo); 
        } catch(e) {
            console.error("Erro ao salvar comentário", e);
            alert("Erro ao publicar comentário.");
        }
    }

    async function deletarComentario(timestamp, titulo) {
        if(!confirm("Tem certeza que deseja excluir este comentário?")) return;
        
        userData.comentarios = userData.comentarios.filter(c => c.timestamp !== timestamp);
        
        try {
            await updateDoc(userDocRef, { comentarios: userData.comentarios });
            
            if (dom.modal.bg.classList.contains("open")) {
                renderCommentsForMovie(titulo); 
            }
            if (currentView === 'amigos') {
                mostrarAmigos();
            }
        } catch(e) {
            console.error("Erro ao deletar comentário", e);
            alert("Erro ao excluir comentário.");
        }
    }

    async function renderCommentsForMovie(titulo) {
        dom.modal.commentsList.innerHTML = '<p style="color:#888; font-size: 13px;">Carregando comentários...</p>';
        try {
            const querySnapshot = await getDocs(collection(db, "usuarios"));
            let todosComentarios = [];

            querySnapshot.forEach(doc => {
                const data = doc.data();
                if (data.isPublic || doc.id === auth.currentUser.uid) {
                    const userComments = data.comentarios || [];
                    const userRating = (data.estrelas && data.estrelas[titulo]) ? data.estrelas[titulo] : 0;
                    const movieComments = userComments.filter(c => c.filme === titulo);

                    movieComments.forEach(c => {
                        todosComentarios.push({
                            uid: doc.id,
                            nome: data.apelido || "Anônimo",
                            foto: data.foto || "https://cdn.pixabay.com/photo/2015/10/05/22/37/blank-profile-picture-973460_960_720.png",
                            texto: c.texto,
                            timestamp: c.timestamp,
                            rating: userRating
                        });
                    });
                }
            });

            todosComentarios.sort((a, b) => b.timestamp - a.timestamp);

            dom.modal.commentsList.innerHTML = '';
            if(todosComentarios.length === 0) {
                dom.modal.commentsList.innerHTML = '<p style="color:#888; font-size: 13px; font-style: italic;">Ninguém comentou sobre ainda. Seja a primeira!</p>';
            } else {
                todosComentarios.forEach(c => {
                    const div = document.createElement('div');
                    div.className = 'comment-bubble';
                    
                    const isOwner = c.uid === auth.currentUser.uid;
                    const deleteBtnHtml = isOwner ? `<button class="delete-comment-btn" title="Excluir">🗑️</button>` : '';

                    div.innerHTML = `
                        <img src="${c.foto}" class="comment-pic">
                        <div class="comment-content">
                            <div class="comment-header">
                                <strong>${c.nome}</strong>
                                <span class="comment-stars">${createStarsHTML(c.rating)}</span>
                                ${deleteBtnHtml}
                            </div>
                            <p>${c.texto}</p>
                            <span class="comment-date">${new Date(c.timestamp).toLocaleDateString('pt-BR')}</span>
                        </div>
                    `;
                    
                    if (isOwner) {
                        div.querySelector('.delete-comment-btn').onclick = () => deletarComentario(c.timestamp, titulo);
                    }

                    dom.modal.commentsList.appendChild(div);
                });
            }
        } catch(e) {
            console.error("Erro ao carregar comentários:", e);
            dom.modal.commentsList.innerHTML = '<p style="color:red; font-size: 13px;">Erro ao carregar os comentários.</p>';
        }
    }

    function createClickableFilterHTML(type, data, joiner = ', ') {
        if (!data) return '';
        let items = [];

        if (Array.isArray(data)) {
            items = data;
        } else {
            items = String(data).split(/\s*[\/,]\s*/);
        }

        return items
            .map(item => {
                const cleanItem = item.trim();
                if (cleanItem) {
                    return `<span class="clickable-filter" data-filter-type="${type}" data-filter-value="${cleanItem}">${cleanItem}</span>`;
                }
                return null;
            })
            .filter(Boolean)
            .join(joiner);
    }

    function handleDynamicFilterClick(type, value) {
        fecharModal();
        resetFilters();
        dom.search.box.value = '';

        const filteredList = filmes.filter(filme => {
            const propertyValue = filme[type];
            if (!propertyValue) return false;

            if (Array.isArray(propertyValue)) {
                return propertyValue.map(item => item.trim()).includes(value);
            }
            
            const values = String(propertyValue).split(/\s*[\/,]\s*/).map(item => item.trim());
            return values.includes(value);
        });
        
        mostrarFilmesGrid(filteredList);
        
        const title = document.createElement('h2');
        title.className = 'section-title dynamic-title';
        let typeDisplay = type.charAt(0).toUpperCase() + type.slice(1);
        title.textContent = `Exibindo por ${typeDisplay}: ${value}`;
        
        dom.displayArea.prepend(title);
        ocultarContador();
    }

    function abrirModal(index) {
      fecharChat(); 
      syncFilmesWithUserData();
      const f = filmes[index];
      dom.modal.poster.src = f.imagem;
      dom.modal.title.textContent = f.titulo;
      dom.modal.modalDurationDots.innerHTML = createDurationDotsHTML(f.screentime);
      dom.modal.sinopse.textContent = f.sinopse;

      const anoHTML = createClickableFilterHTML('ano', f.ano);
      const paisHTML = createClickableFilterHTML('pais', f.pais);
      const plataformaHTML = createClickableFilterHTML('plataforma', f.plataforma, ' / ');
      const elencoHTML = createClickableFilterHTML('elenco', f.elenco, ', ');

      dom.modal.info.innerHTML = `<strong>Ano:</strong> ${anoHTML} | <strong>País:</strong> ${paisHTML}<br><strong>Plataforma:</strong> ${plataformaHTML}<br><strong>Elenco:</strong> ${elencoHTML || 'Não informado'}`;
      
      updateModalButtons(index);

      dom.modal.youtubeLink.style.display = f.youtubeLink ? 'inline-block' : 'none';
      if(f.youtubeLink) dom.modal.youtubeLink.href = f.youtubeLink;

      // PREENCHER A GALERIA INLINE 
      const hasImages = f.galleryImages && f.galleryImages.length > 0;
      if(hasImages) {
        dom.modal.inlineGalleryWrapper.style.display = 'block';
        dom.modal.galleryContainer.innerHTML = '';
        f.galleryImages.forEach(imgUrl => {
            const img = document.createElement('img');
            img.src = imgUrl;
            dom.modal.galleryContainer.appendChild(img);
        });
      } else {
        dom.modal.inlineGalleryWrapper.style.display = 'none';
      }

      dom.modal.favBtn.onclick = () => toggleFavorite(f.titulo);
      dom.modal.watchBtn.onclick = () => toggleAssistido(f.titulo);
      dom.modal.wantBtn.onclick = () => toggleQueroAssistir(f.titulo);

      renderStarsInModal(index);

      dom.modal.commentInput.value = ''; 
      dom.modal.submitCommentBtn.onclick = () => adicionarComentario(f.titulo);
      renderCommentsForMovie(f.titulo); 
      
      dom.modal.bg.classList.add("open");
      dom.modal.closeBtn.focus();
    }

    function updateModalButtons(index){
      const f = filmes[index];
      dom.modal.favBtn.classList.toggle('active', f.favorito);
      dom.modal.favBtn.textContent = '❤';
      dom.modal.watchBtn.classList.toggle('active', f.assistido);
      dom.modal.watchBtn.textContent = f.assistido ? 'Assistido' : 'Marcar como assistido';
      dom.modal.wantBtn.classList.toggle('active', f.queroAssistir);
      dom.modal.wantBtn.textContent = f.queroAssistir ? 'Na Lista' : '+';
    }

    function renderStarsInModal(index) {
      const filme = filmes[index];
      dom.modal.stars.innerHTML = '';
      for (let i = 1; i <= 5; i++) {
        const star = document.createElement('span');
        star.className = 'star';
        star.innerHTML = '★';
        if (i <= filme.userRating) star.classList.add('selected');
        star.onclick = () => setUserRating(filme.titulo, i);
        dom.modal.stars.appendChild(star);
      }
    }
    
    function fecharModal() {
      dom.modal.bg.classList.remove("open");
    }

    function init() {
      dom.main.style.display = "block";
      syncFilmesWithUserData();
      updateWatchedCounters(); 
      popularTags();
      mostrarTelaInicial();
      
      if(auth.currentUser) dom.chat.floatingBtn.style.display = 'flex';

      dom.chat.floatingBtn.addEventListener('click', abrirChat);
      dom.chat.sendBtn.addEventListener('click', enviarMensagemChat);
      dom.chat.input.addEventListener('keydown', (e) => {
          if(e.key === 'Enter' && !e.shiftKey) {
              e.preventDefault();
              enviarMensagemChat();
          }
      });
      dom.chat.closeBtn.addEventListener('click', fecharChat);

      dom.sideMenu.profileFlagBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          dom.sideMenu.profileFlagDropdown.classList.toggle('show');
      });

      dom.sideMenu.flagOptions.forEach(opt => {
          opt.addEventListener('click', async (e) => {
              const selectedFlag = e.target.dataset.flag;
              dom.sideMenu.profileFlagBtn.src = selectedFlag;
              dom.sideMenu.profilePic.classList.add('has-border');
              dom.sideMenu.profileFlagDropdown.classList.remove('show');

              if (userDocRef) {
                  await updateDoc(userDocRef, { bandeira: selectedFlag });
                  userData.bandeira = selectedFlag;
              }
          });
      });

      dom.search.box.addEventListener("input", () => applyAllFilters());
      dom.title.addEventListener('click', () => { dom.search.box.value = ""; ocultarContador(); mostrarTelaInicial(); });

      dom.modal.info.addEventListener('click', e => {
        if (e.target.classList.contains('clickable-filter')) {
            const type = e.target.dataset.filterType;
            const value = e.target.dataset.filterValue;
            handleDynamicFilterClick(type, value);
        }
      });
      
      dom.modal.closeBtn.addEventListener("click", fecharModal);
      
      document.addEventListener("keydown", (e) => { 
          if(e.key === "Escape") {
              if (dom.modal.bg.classList.contains("open")) fecharModal(); 
              if (dom.chat.sidebar.classList.contains("open")) fecharChat(); 
          }
      });

      dom.sideMenu.openBtn.addEventListener('click', openSideMenu);
      dom.sideMenu.closeBtn.addEventListener('click', closeSideMenu);
      dom.sideMenu.overlay.addEventListener('click', closeSideMenu);
      dom.sideMenu.logoutBtn.addEventListener('click', () => {
          signOut(auth);
      });
      dom.search.toggleBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          dom.search.wrapper.classList.toggle('show');
          if (dom.search.wrapper.classList.contains('show')) dom.search.box.focus();
      });
      dom.tags.dropdownBtn.onclick = (e) => {
          e.stopPropagation();
          dom.tags.dropdownContent.classList.toggle('show');
      };
      
      document.addEventListener('click', (e) => {
          if (dom.search.wrapper.classList.contains('show') && !dom.header.contains(e.target)) {
              dom.search.wrapper.classList.remove('show');
          }
          if (!dom.tags.dropdownBtn.contains(e.target) && dom.tags.dropdownContent.classList.contains('show')) {
              dom.tags.dropdownContent.classList.remove('show');
          }
          if (dom.sideMenu.profileFlagBtn && !dom.sideMenu.profileFlagBtn.contains(e.target) && dom.sideMenu.profileFlagDropdown.classList.contains('show')) {
              dom.sideMenu.profileFlagDropdown.classList.remove('show');
          }
      });
      
      const createSideMenuFilterHandler = (baseFilterText) => () => {
        resetFilters();
        currentBaseFilter = baseFilterText;
        currentView = 'grid';
        applyAllFilters();
        closeSideMenu();
      };

      dom.sideMenu.favBtn.onclick = createSideMenuFilterHandler('Favoritos');
      dom.sideMenu.watchBtn.onclick = createSideMenuFilterHandler('Assistidos');
      dom.sideMenu.wantBtn.onclick = createSideMenuFilterHandler('Quero Assistir');
      dom.sideMenu.amigosBtn.onclick = () => {
          mostrarAmigos();
          closeSideMenu();
      };
      dom.sideMenu.helpBtn.onclick = () => {
          mostrarAjuda();
          closeSideMenu();
      };

      dom.sideMenu.watchBtn.addEventListener("click", () => {
        document.getElementById('watched-counter').style.display = 'block';
      });
      
      dom.sideMenu.favBtn.addEventListener("click", ocultarContador);
      dom.sideMenu.wantBtn.addEventListener("click", ocultarContador);

      const savedTheme = localStorage.getItem('saficos_theme');
      if (savedTheme === 'light') {
          document.body.classList.add('light-theme');
          dom.sideMenu.themeToggle.checked = true;
      }

      dom.sideMenu.themeToggle.addEventListener('change', (e) => {
          if (e.target.checked) {
              document.body.classList.add('light-theme');
              localStorage.setItem('saficos_theme', 'light');
          } else {
              document.body.classList.remove('light-theme');
              localStorage.setItem('saficos_theme', 'dark');
          }
      });
    }

    dom.auth.loginBtn.onclick = async () => {
      dom.auth.errorDisplay.textContent = '';
      try {
        await signInWithEmailAndPassword(auth, dom.auth.emailInput.value, dom.auth.passwordInput.value);
      } catch (e) {
        switch(e.code) {
            case 'auth/user-not-found':
            case 'auth/wrong-password':
            case 'auth/invalid-credential':
                dom.auth.errorDisplay.textContent = 'Email ou senha inválidos.';
                break;
            default:
                dom.auth.errorDisplay.textContent = 'Erro no login: ' + e.message;
        }
      }
    };

    dom.auth.registerBtn.onclick = async () => {
      dom.auth.errorDisplay.textContent = '';
      try {
        const cred = await createUserWithEmailAndPassword(auth, dom.auth.emailInput.value, dom.auth.passwordInput.value);
        await setDoc(doc(db, "usuarios", cred.user.uid), {
          favoritos: [],
          assistidos: [],
          quero: [],
          estrelas: {},
          comentarios: [], 
          bandeira: "", 
          apelido: "Novo Usuário",
          foto: "https://cdn.pixabay.com/photo/2015/10/05/22/37/blank-profile-picture-973460_960_720.png",
          isPublic: false
        });
      } catch (e) {
         switch(e.code) {
            case 'auth/email-already-in-use':
                dom.auth.errorDisplay.textContent = 'Este email já está em uso.';
                break;
            case 'auth/weak-password':
                dom.auth.errorDisplay.textContent = 'A senha deve ter no mínimo 6 caracteres.';
                break;
            default:
                dom.auth.errorDisplay.textContent = 'Erro no cadastro: ' + e.message;
        }
      }
    };

    dom.auth.forgotPasswordLink.onclick = async () => {
      dom.auth.errorDisplay.textContent = '';
      if (!dom.auth.emailInput.value) {
          alert("Por favor, digite seu e-mail no campo correspondente.");
          return;
      }
      try {
        await sendPasswordResetEmail(auth, dom.auth.emailInput.value);
        alert("Email de recuperação de senha enviado para " + dom.auth.emailInput.value);
      } catch (e) {
        dom.auth.errorDisplay.textContent = 'Erro ao enviar email: ' + e.message;
      }
    };

    onAuthStateChanged(auth, async (user) => {
      if (user) {
        dom.auth.section.style.display = 'none';
        userDocRef = doc(db, "usuarios", user.uid);

        dom.sideMenu.profileName.addEventListener('blur', async () => {
            const newName = dom.sideMenu.profileName.textContent.trim();
            if (newName && userDocRef) {
                await updateDoc(userDocRef, { apelido: newName });
            }
        });

        dom.sideMenu.profilePicEditBtn.addEventListener('click', async () => {
            const url = prompt("Cole o URL da nova imagem de perfil:");
            if (url && userDocRef) {
                dom.sideMenu.profilePic.src = url;
                await updateDoc(userDocRef, { foto: url });
            }
        });
        
        dom.sideMenu.visibilityToggle.addEventListener('change', async (e) => {
            const isPublic = e.target.checked;
            if(userDocRef) {
                await updateDoc(userDocRef, { isPublic: isPublic });
                userData.isPublic = isPublic;
            }
        });

        const docSnap = await getDoc(userDocRef);
        if (docSnap.exists()) {
          userData = docSnap.data();
          if (!userData.comentarios) userData.comentarios = []; 
          if (userData.foto) dom.sideMenu.profilePic.src = userData.foto;
          if (userData.apelido) dom.sideMenu.profileName.textContent = userData.apelido;
          dom.sideMenu.visibilityToggle.checked = !!userData.isPublic; 

          if (userData.bandeira) {
              dom.sideMenu.profileFlagBtn.src = userData.bandeira;
              dom.sideMenu.profilePic.classList.add('has-border');
          } else {
              dom.sideMenu.profileFlagBtn.src = 'lesbica.png'; 
              dom.sideMenu.profilePic.classList.remove('has-border');
          }

        } else {
          userData = { favoritos: [], assistidos: [], quero: [], estrelas: {}, comentarios: [], bandeira: "", apelido: "Novo Usuário", foto: "https://cdn.pixabay.com/photo/2015/10/05/22/37/blank-profile-picture-973460_960_720.png", isPublic: false };
          await setDoc(userDocRef, userData);
          dom.sideMenu.visibilityToggle.checked = false;
          dom.sideMenu.profileFlagBtn.src = 'lesbica.png';
          dom.sideMenu.profilePic.classList.remove('has-border');
        }
        
        initChatListener();
        
        try {
            const response = await fetch('filmes.json');
            if (!response.ok) {
              throw new Error(`HTTP error! status: ${response.status}`);
            }
            filmes = await response.json();
            init(); 
        } catch (error) {
            console.error("Não foi possível carregar o arquivo de filmes (filmes.json):", error);
            dom.displayArea.innerHTML = "<p>Erro ao carregar a lista de filmes. Verifique o console para mais detalhes.</p>";
        }

      } else {
        dom.main.style.display = 'none';
        dom.auth.section.style.display = 'flex';
        userData = { favoritos: [], assistidos: [], quero: [], estrelas: {}, comentarios: [], bandeira: "", isPublic: false };
        if (dom.chat.floatingBtn) dom.chat.floatingBtn.style.display = 'none';
        if (unsubscribeChat) unsubscribeChat();
      }
    });

  </script>
</body>
</html>
